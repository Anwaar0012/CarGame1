name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A6C3D2: ${{ secrets.A6C3D2 }}
          BAFBAA: ${{ secrets.BAFBAA }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A6C3D2', '')
          sec_b = os.environ.get('BAFBAA', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 6f4f6b1f2fc78d56b4 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- bf28922d0c59cb11e0 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
